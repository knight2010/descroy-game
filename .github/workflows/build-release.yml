name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 建议使用 Node 20（更适配 Vite 5+ 和 Tailwind v4）

      - name: 安装依赖
        run: npm install --legacy-peer-deps

      - name: 构建静态资源
        run: npm run build

      - name: 压缩产物并发布 Release
        run: |
          BUILD_DIR="dist"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "错误: 未找到 $BUILD_DIR 目录，请检查打包输出目录"
            exit 1
          fi
          cd $BUILD_DIR
          zip -r ../game-dist.zip ./*
          cd ..

      - name: 上传至 Release
        uses: softprops/action-gh-release@v2
        with:
          files: game-dist.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
