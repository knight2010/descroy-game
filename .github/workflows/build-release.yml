name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '请输入发布的版本号（例如 v1.0.0）'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 安装依赖
        run: npm ci || npm install

      - name: 构建静态资源
        run: npm run build

      - name: 压缩静态构建产物
        run: |
          BUILD_DIR="dist" # 根据实际情况确认是 dist 还是 build
          cd $BUILD_DIR
          zip -r ../game-dist.zip ./*
          cd ..

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 使用手动输入的版本号作为 Release 的 tag
          tag_name: ${{ github.event.inputs.tag_name }}
          files: game-dist.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
